<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-width: 250px;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .slot-popup { min-width: 200px; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="info-panel">
        <h6><i class="fas fa-parking me-2"></i>Live Parking Status</h6>
        <div class="mb-2">
            <span class="badge bg-success">Available: <span id="availableCount">--</span></span>
            <span class="badge bg-danger ms-2">Occupied: <span id="occupiedCount">--</span></span>
        </div>
        <div id="nearestInfo" class="small text-muted"></div>
        <button class="btn btn-primary btn-sm w-100 mt-2" onclick="locateUser()">
            <i class="fas fa-location-arrow me-1"></i> My Location
        </button>
    </div>

    <div class="legend">
        <div><span class="legend-color" style="background: #2ecc71;"></span> Available</div>
        <div><span class="legend-color" style="background: #e74c3c;"></span> Occupied</div>
        <div><span class="legend-color" style="background: #f39c12;"></span> Reserved</div>
        <div><span class="legend-color" style="background: #4361ee;"></span> Your Location</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let markers = [];
        let userMarker = null;
        let ws = null;

        function initMap() {
            map = L.map('map').setView([27.7172, 85.3240], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/ws/parking/');

            ws.onopen = () => {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({type: 'subscribe', groups: ['parking_updates']}));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'parking_update') {
                    handleUpdate(data.data);
                } else if (data.type === 'initial_data') {
                    loadMarkers(data.slots);
                    updateStats(data.stats);
                }
            };
        }

        function handleUpdate(data) {
            if (data.type === 'slot_update') {
                updateMarkerStatus(data);
            }
        }

        function updateMarkerStatus(data) {
            const marker = markers.find(m => m.slotNumber === data.slot_number);
            if (marker && marker.marker) {
                const colors = {available: '#2ecc71', occupied: '#e74c3c', reserved: '#f39c12'};
                const newIcon = L.divIcon({
                    html: `<div style="background-color: ${colors[data.new_status]}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white;"></div>`,
                    iconSize: [20, 20]
                });
                marker.marker.setIcon(newIcon);
                marker.status = data.new_status;
            }
        }

        async function loadMarkers(slots) {
            markers.forEach(m => { if (m.marker) map.removeLayer(m.marker); });
            markers = [];

            for (const slot of slots) {
                if (slot.coordinates.lat && slot.coordinates.lng) {
                    const colors = {available: '#2ecc71', occupied: '#e74c3c', reserved: '#f39c12'};
                    const color = colors[slot.status] || '#95a5a6';

                    const marker = L.marker([slot.coordinates.lat, slot.coordinates.lng], {
                        icon: L.divIcon({
                            html: `<div style="background-color: ${color}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white;"></div>`,
                            iconSize: [20, 20]
                        })
                    }).addTo(map);

                    marker.bindPopup(`
                        <div class="slot-popup">
                            <b>Slot ${slot.slot_number}</b><br>
                            Zone: ${slot.zone_id}<br>
                            Type: ${slot.slot_type}<br>
                            Status: <span class="badge bg-${slot.status === 'available' ? 'success' : (slot.status === 'occupied' ? 'danger' : 'warning')}">${slot.status}</span><br>
                            <button class="btn btn-primary btn-sm mt-2" onclick="allocateSlot('${slot.slot_number}')">Park Here</button>
                        </div>
                    `);

                    markers.push({slotNumber: slot.slot_number, marker: marker, status: slot.status});
                }
            }
        }

        function updateStats(stats) {
            if (stats) {
                document.getElementById('availableCount').textContent = stats.available_slots;
                document.getElementById('occupiedCount').textContent = stats.occupied_slots;
            }
        }

        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.setView([lat, lng], 16);

                        if (userMarker) map.removeLayer(userMarker);
                        userMarker = L.marker([lat, lng], {
                            icon: L.divIcon({
                                html: '<div style="background-color: #4361ee; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 2px #4361ee;"></div>',
                                iconSize: [16, 16]
                            })
                        }).addTo(map).bindPopup('Your Location').openPopup();

                        findNearestParking(lat, lng);
                    },
                    (error) => { console.error('Geolocation error:', error); }
                );
            }
        }

        async function findNearestParking(lat, lng) {
            try {
                const response = await fetch('/api/nearest/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({lat: lat, lng: lng, limit: 5})
                });
                const data = await response.json();

                if (data.success && data.nearest_slots.length > 0) {
                    const nearest = data.nearest_slots[0];
                    document.getElementById('nearestInfo').innerHTML = `
                        <i class="fas fa-map-pin me-1"></i> Nearest: Slot ${nearest.slot_number} (${nearest.distance_meters}m)<br>
                        <i class="fas fa-walking me-1"></i> ${nearest.walk_time_minutes} min walk
                    `;
                }
            } catch (error) {
                console.error('Error finding nearest:', error);
            }
        }

        async function allocateSlot(slotNumber) {
            const vehicleNumber = prompt('Enter vehicle number:');
            if (!vehicleNumber) return;

            try {
                const response = await fetch('/api/allocate/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        vehicle_type: 'Sedan',
                        vehicle_number: vehicleNumber,
                        duration: 2
                    })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`✅ Allocated slot ${data.slot_number}`);
                    location.reload();
                } else {
                    alert('Allocation failed');
                }
            } catch (error) {
                alert('Error allocating slot');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initWebSocket();
            setTimeout(() => locateUser(), 1000);
        });
    </script>
</body>
</html>
