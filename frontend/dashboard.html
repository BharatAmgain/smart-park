<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #1a1a2e;
        }

        body {
            background: #f5f6fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            background: var(--dark);
            min-height: 100vh;
            color: white;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            transition: all 0.3s;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(67,97,238,0.3);
            color: white;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .zone-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }

        .progress-bar-custom {
            height: 8px;
            border-radius: 4px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .status-available { background: #d5f4e6; color: #27ae60; }
        .status-occupied { background: #f8d7da; color: #e74c3c; }
        .status-reserved { background: #fff3cd; color: #f39c12; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar">
                <div class="p-3">
                    <h4 class="mb-4"><i class="fas fa-parking me-2"></i>SmartPark</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <i class="fas fa-home me-2"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/map/">
                                <i class="fas fa-map me-2"></i> Live Map
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/">
                                <i class="fas fa-cog me-2"></i> Admin
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Dashboard</h2>
                    <span id="liveTime" class="text-muted"></span>
                </div>

                <!-- Stats Row -->
                <div class="row">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="stat-value" id="totalSlots">--</div>
                                    <div class="text-muted">Total Slots</div>
                                </div>
                                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                    <i class="fas fa-parking"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="stat-value text-success" id="availableSlots">--</div>
                                    <div class="text-muted">Available</div>
                                </div>
                                <div class="stat-icon bg-success bg-opacity-10 text-success">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="stat-value text-danger" id="occupiedSlots">--</div>
                                    <div class="text-muted">Occupied</div>
                                </div>
                                <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                                    <i class="fas fa-car"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="stat-value text-warning" id="reservedSlots">--</div>
                                    <div class="text-muted">Reserved</div>
                                </div>
                                <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                                    <i class="fas fa-clock"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="stat-card">
                            <h5>Zone Occupancy</h5>
                            <canvas id="occupancyChart" height="200"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="stat-card">
                            <h5>Hourly Trends</h5>
                            <canvas id="trendsChart" height="200"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Zones List -->
                <div class="stat-card mt-4">
                    <h5 class="mb-3">Parking Zones</h5>
                    <div id="zonesList"></div>
                </div>

                <!-- Recent Sessions -->
                <div class="stat-card mt-4">
                    <h5 class="mb-3">Recent Sessions</h5>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr><th>Session ID</th><th>Slot</th><th>Vehicle</th><th>Start Time</th><th>Status</th></tr>
                            </thead>
                            <tbody id="sessionsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let occupancyChart = null;
        let trendsChart = null;
        let ws = null;

        // Initialize WebSocket
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/ws/parking/');

            ws.onopen = () => console.log('WebSocket connected');
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'parking_update') {
                    refreshDashboard();
                }
            };
        }

        // Refresh dashboard
        async function refreshDashboard() {
            try {
                const response = await fetch('/api/dashboard/');
                const data = await response.json();

                if (data.overview) {
                    document.getElementById('totalSlots').textContent = data.overview.total_slots;
                    document.getElementById('availableSlots').textContent = data.overview.available_slots;
                    document.getElementById('occupiedSlots').textContent = data.overview.occupied_slots;
                    document.getElementById('reservedSlots').textContent = data.overview.reserved_slots;
                }

                if (data.zones) {
                    displayZones(data.zones);
                    updateCharts(data.zones);
                }
            } catch (error) {
                console.error('Error refreshing dashboard:', error);
            }
        }

        // Display zones
        function displayZones(zones) {
            const container = document.getElementById('zonesList');
            let html = '';

            zones.forEach(zone => {
                const availablePercent = (zone.available_slots / zone.total_slots * 100).toFixed(0);
                const barColor = availablePercent > 50 ? '#2ecc71' : (availablePercent > 20 ? '#f39c12' : '#e74c3c');

                html += `
                    <div class="zone-card">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <strong>Zone ${zone.zone_id}</strong> - ${zone.zone_name}
                                <span class="status-badge status-available ms-2">${zone.available_slots} available</span>
                            </div>
                            <span>${availablePercent}%</span>
                        </div>
                        <div class="progress-bar-custom">
                            <div class="progress-fill" style="width: ${availablePercent}%; background-color: ${barColor};"></div>
                        </div>
                        <div class="mt-2 text-muted small">
                            <i class="fas fa-dollar-sign me-1"></i> $${zone.hourly_rate}/hour
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Update charts
        function updateCharts(zones) {
            const labels = zones.map(z => `Zone ${z.zone_id}`);
            const availableData = zones.map(z => z.available_slots);
            const occupiedData = zones.map(z => z.occupied);

            if (occupancyChart) {
                occupancyChart.destroy();
            }

            const ctx = document.getElementById('occupancyChart').getContext('2d');
            occupancyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Available', data: availableData, backgroundColor: '#2ecc71', borderRadius: 8 },
                        { label: 'Occupied', data: occupiedData, backgroundColor: '#e74c3c', borderRadius: 8 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
            });
        }

        // Load recent sessions
        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions/');
                const sessions = await response.json();
                const tbody = document.getElementById('sessionsTable');

                if (sessions.length > 0) {
                    let html = '';
                    sessions.slice(0, 10).forEach(s => {
                        const statusClass = s.status === 'active' ? 'status-available' : (s.status === 'completed' ? 'status-occupied' : 'status-reserved');
                        html += `<tr>
                            <td>${s.session_id?.substring(0, 8) || 'N/A'}</td>
                            <td>${s.slot?.slot_number || 'N/A'}</td>
                            <td>${s.vehicle_number}</td>
                            <td>${new Date(s.start_time).toLocaleString()}</td>
                            <td><span class="status-badge ${statusClass}">${s.status}</span></td>
                        </tr>`;
                    });
                    tbody.innerHTML = html;
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No sessions found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }

        // Update live time
        function updateLiveTime() {
            const now = new Date();
            document.getElementById('liveTime').textContent = now.toLocaleTimeString();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshDashboard();
            loadSessions();
            initWebSocket();
            updateLiveTime();
            setInterval(updateLiveTime, 1000);
            setInterval(refreshDashboard, 30000);
        });
    </script>
</body>
</html>
