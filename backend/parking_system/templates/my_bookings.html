<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0c29; font-family: 'Inter', sans-serif; color: white; }
        .navbar { background: rgba(15, 25, 45, 0.8); backdrop-filter: blur(16px); }
        .navbar-brand { color: white; font-size: 1.3rem; font-weight: bold; }
        .stat-card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.1); }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .status-reserved { background: #f39c12; color: #1a1a2e; }
        .status-active { background: #3498db; color: white; }
        .status-completed { background: #2ecc71; color: #1a1a2e; }
        .status-cancelled { background: #e74c3c; color: white; }
        .btn-cancel { background: #e74c3c; border: none; border-radius: 20px; padding: 0.2rem 1rem; font-size: 0.7rem; color: white; }
        .btn-cancel:hover { background: #c0392b; }
        .refresh-btn { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #a855f7, #4cc9f0); border: none; border-radius: 50%; width: 55px; height: 55px; color: white; font-size: 1.4rem; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 1000; transition: 0.3s; }
        .refresh-btn:hover { transform: rotate(180deg); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-parking"></i> SmartPark</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/my-bookings/">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout/">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <h2><i class="fas fa-calendar-alt me-2"></i>My Parking Bookings</h2>
        <div id="bookingsList" class="mt-4">
            <div class="text-center py-5">Loading...</div>
        </div>
    </div>
    <button class="refresh-btn" onclick="loadBookings()"><i class="fas fa-sync-alt"></i></button>

    <script>
        async function loadBookings() {
            try {
                const res = await fetch('/api/dashboard/');
                const data = await res.json();
                if (data.success && data.recent_sessions) {
                    displayBookings(data.recent_sessions);
                } else {
                    document.getElementById('bookingsList').innerHTML = '<div class="alert alert-warning">No bookings found.</div>';
                }
            } catch(e) {
                console.error(e);
                document.getElementById('bookingsList').innerHTML = '<div class="alert alert-danger">Error loading bookings.</div>';
            }
        }

        function displayBookings(sessions) {
            const container = document.getElementById('bookingsList');
            if (!sessions || sessions.length === 0) {
                container.innerHTML = '<div class="alert alert-info">You have no parking sessions yet.</div>';
                return;
            }
            let html = '<div class="row">';
            sessions.forEach(s => {
                let statusClass = '';
                let statusText = s.status;
                if (s.status === 'reserved') { statusClass = 'status-reserved'; statusText = 'Reserved'; }
                else if (s.status === 'active') { statusClass = 'status-active'; statusText = 'Active'; }
                else if (s.status === 'completed') { statusClass = 'status-completed'; statusText = 'Completed'; }
                else if (s.status === 'cancelled') { statusClass = 'status-cancelled'; statusText = 'Cancelled'; }
                const isFutureReserved = (s.status === 'reserved');
                html += `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <strong>Slot ${s.slot_number}</strong>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div><i class="fas fa-map-marker-alt"></i> Zone ${s.zone_id}</div>
                            <div><i class="fas fa-car"></i> Vehicle: ${s.vehicle_number}</div>
                            <div><i class="fas fa-clock"></i> Start: ${s.start_time}</div>
                            <div><i class="fas fa-credit-card"></i> Payment: ${s.payment_method.toUpperCase()}</div>
                            ${isFutureReserved ? `<button class="btn-cancel mt-2" onclick="cancelBooking('${s.session_id}')"><i class="fas fa-times"></i> Cancel Booking</button>` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function cancelBooking(sessionId) {
            if (!confirm('Are you sure you want to cancel this reservation? The slot will be freed and your payment will be refunded.')) return;
            try {
                const res = await fetch(`/api/cancel-session/${sessionId}/`, { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') } });
                const data = await res.json();
                if (data.success) {
                    alert('Booking cancelled and refunded successfully.');
                    loadBookings();
                } else {
                    alert(data.error);
                }
            } catch(e) {
                alert('Error cancelling booking.');
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        loadBookings();
    </script>
</body>
</html>
