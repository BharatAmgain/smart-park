<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: radial-gradient(circle at 30% 10%, #0a0f2a, #03051a); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .glass-card { background: rgba(15, 25, 45, 0.55); backdrop-filter: blur(16px); border-radius: 48px; padding: 2rem 2.5rem; border: 1px solid rgba(0, 255, 255, 0.25); box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1); width: 100%; max-width: 480px; transition: transform 0.3s ease; }
        .glass-card:hover { transform: scale(1.01); border-color: rgba(0, 255, 255, 0.4); }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo i { font-size: 3rem; background: linear-gradient(135deg, #a5f0ff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h2 { text-align: center; font-weight: 700; background: linear-gradient(135deg, #fff, #a5f0ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: rgba(165, 240, 255, 0.7); font-size: 0.85rem; margin-bottom: 1.8rem; }
        .form-control { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px; padding: 0.75rem 1.2rem; color: white; font-size: 0.9rem; transition: all 0.2s; }
        .form-control:focus { background: rgba(255, 255, 255, 0.15); border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2); color: white; }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn-primary { background: linear-gradient(135deg, #a855f7, #4cc9f0); border: none; border-radius: 40px; padding: 0.75rem; font-weight: 600; font-size: 1rem; transition: all 0.3s; width: 100%; margin-top: 0.5rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4); background: linear-gradient(135deg, #c084fc, #38bdf8); }
        .social-buttons { margin: 1.5rem 0; }
        .btn-google { background: #DB4437; color: white; border: none; border-radius: 40px; padding: 0.7rem; font-weight: 500; width: 100%; margin-bottom: 0.8rem; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #c53929; transform: translateY(-2px); }
        .btn-facebook { background: #4267B2; color: white; border: none; border-radius: 40px; padding: 0.7rem; font-weight: 500; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-facebook:hover { background: #365899; transform: translateY(-2px); }
        .divider { display: flex; align-items: center; text-align: center; margin: 1.2rem 0; color: rgba(255,255,255,0.5); font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }
        .register-link { text-align: center; margin-top: 1.2rem; color: rgba(255, 255, 255, 0.7); font-size: 0.85rem; }
        .register-link a { color: #a855f7; text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; color: #c084fc; }
        .error-message { background: rgba(231, 76, 60, 0.2); border-left: 3px solid #e74c3c; border-radius: 12px; padding: 0.5rem 1rem; margin-bottom: 1rem; font-size: 0.8rem; color: #ffb3b3; }
        @media (max-width: 480px) { .glass-card { padding: 1.5rem; } }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo"><i class="fas fa-parking"></i></div>
        <h2>Welcome Back</h2>
        <div class="subtitle">Sign in to continue to SmartPark</div>

        <div class="social-buttons">
            <a href="/accounts/google/login/" class="btn-google">
                <i class="fab fa-google"></i> Continue with Google
            </a>
            <a href="/accounts/facebook/login/" class="btn-facebook">
                <i class="fab fa-facebook-f"></i> Continue with Facebook
            </a>
        </div>

        <div class="divider">or</div>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
            <button type="submit" class="btn-primary">Sign In with Email</button>
        </form>

        <div class="register-link">Don't have an account? <a href="/register/">Create one now</a></div>
    </div>
</body>
</html>
